name: CI and Release

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: rust-ci-release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: ha-notifier

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build debug
        run: cargo build --workspace --all-features
      - name: Run tests
        run: cargo test --workspace --all-features

  version:
    name: Determine version and tag release
    needs: test
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Calculate SemVer bump and create tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          latest_tag="$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          if [[ -n "$latest_tag" ]]; then
            range="${latest_tag}..HEAD"
          else
            range="HEAD"
          fi

          bump=none
          while IFS= read -r subject; do
            [[ -z "$subject" ]] && continue
            if [[ "$subject" =~ BREAKING[[:space:]]CHANGE ]] || [[ "$subject" =~ ^[a-zA-Z]+(\([^)]*\))?!: ]]; then
              bump=major
              break
            elif [[ "$subject" =~ ^feat(\([^)]*\))?: ]]; then
              [[ "$bump" != major ]] && bump=minor
            elif [[ "$subject" =~ ^(fix|perf)(\([^)]*\))?: ]] && [[ "$bump" == none ]]; then
              bump=patch
            fi
          done < <(git log "$range" --format=%B)

          if [[ "$bump" == none ]]; then
            echo 'release_created=false' >> "$GITHUB_OUTPUT"
            echo 'No releasable Conventional Commit found.'
            exit 0
          fi

          current="$(python3 - <<'PY'
          import re
          text = open('Cargo.toml', encoding='utf-8').read()
          m = re.search(r'^version\s*=\s*["\'](\d+)\.(\d+)\.(\d+)["\']', text, re.M)
          if not m:
              raise SystemExit('Root Cargo.toml must contain a package version like 1.2.3')
          print('.'.join(m.groups()))
          PY
          )"

          IFS=. read -r major minor patch <<< "$current"
          case "$bump" in
            major) ((major+=1)); minor=0; patch=0 ;;
            minor) ((minor+=1)); patch=0 ;;
            patch) ((patch+=1)) ;;
          esac
          version="$major.$minor.$patch"
          tag="v$version"

          python3 - "$version" <<'PY'
          import re, sys
          version = sys.argv[1]
          path = 'Cargo.toml'
          text = open(path, encoding='utf-8').read()
          updated, count = re.subn(
              r'^(version\s*=\s*["\'])\d+\.\d+\.\d+(["\'])',
              rf'\g<1>{version}\g<2>', text, count=1, flags=re.M)
          if count != 1:
              raise SystemExit('Could not update the root package version in Cargo.toml')
          open(path, 'w', encoding='utf-8').write(updated)
          PY

          # Regenerate the lockfile entry for the local package, if this is an application.
          cargo check --workspace --all-features
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          git commit -m "chore: release $version"
          git push origin HEAD:"$GITHUB_REF_NAME"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
          - target: x86_64-apple-darwin
            os: macos-13
            cross: false
          - target: aarch64-apple-darwin
            os: macos-14
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.cross }}" == true ]]; then
            cross build --locked --release --target "${{ matrix.target }}"
          else
            cargo build --locked --release --target "${{ matrix.target }}"
          fi
      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          binary="${APP_NAME}"
          [[ "${{ runner.os }}" == Windows ]] && binary="${APP_NAME}.exe"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/$binary" dist/
          if [[ "${{ runner.os }}" == Windows ]]; then
            7z a "${APP_NAME}-${{ needs.version.outputs.version }}-${{ matrix.target }}.zip" "dist/$binary"
          else
            tar -C dist -czf "${APP_NAME}-${{ needs.version.outputs.version }}-${{ matrix.target }}.tar.gz" "$binary"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.APP_NAME }}-${{ needs.version.outputs.version }}-${{ matrix.target }}.*
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: [version, build]
    if: needs.version.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release and binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create '${{ needs.version.outputs.tag }}' dist/* \
            --repo '${{ github.repository }}' \
            --title '${{ env.APP_NAME }} ${{ needs.version.outputs.tag }}' \
            --generate-notes
