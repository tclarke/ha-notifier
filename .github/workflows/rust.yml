name: CI and Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: rust-ci-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build debug
        run: cargo build --workspace --all-features
      - name: Run tests
        run: cargo test --workspace --all-features
        
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for creating tags and pushing
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for tag history
      
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      
      - name: Compute version and tag
        uses: magdrago/magdrago-rust-semver-action@v1
        with:
          source-globs: .versioning/source_globs.txt
          tag-scope: v
      
      - name: Build release
        if: steps.compute.outputs.bump-kind != 'none'
        run: cargo build --release
      
      - name: Create GitHub Release
        if: steps.compute.outputs.bump-kind != 'none'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.compute.outputs.tag }}
          files: target/release/*
